user  www-data;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

# ============================================================
# 问星 —— Nginx 主配置（整机只跑本项目，官网不再使用）
# 服务器：<你的域名或服务器 IP>（Ubuntu 22.04 / 24.04）
#
#   http://<你的域名或 IP>/api      -> 后端 API
#   http://<你的域名或 IP>/uploads  -> 上传文件
#   http://<你的域名或 IP>/admin/   -> 管理后台
#
# 注意：本文件会整份替换 /etc/nginx/nginx.conf，
#       前提是 80 端口上没有其他 Web 服务（旧官网已停用）。
#       若 80 被宝塔/Apache/另一个 nginx 占用，先停掉它再重启。
#
# 域名解析到本机后：把 server_name 改成 api.你的域名 / admin.你的域名，
# 再用 certbot 加 443 证书。
# ============================================================

events {
    # Ubuntu 的 nginx.service 默认 LimitNOFILE=1024，写 4096 会告警
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      '$request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;

    # 教材导入 / 书籍上传单文件上限 80MB，留出余量
    client_max_body_size 120m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml image/svg+xml application/wasm;

    # 后端为单实例（SQLite 单文件），禁止多节点负载均衡
    upstream wenxing_api {
        server 127.0.0.1:3001;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        # 替换为你自己的域名或服务器 IP
        server_name wenxing.example.com;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # ---------- 后端 API ----------
        location /api/ {
            proxy_pass         http://wenxing_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            # 必须用真实客户端 IP 覆盖，配合后端 TRUST_PROXY=1，否则全局限流会串桶
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # AI 流式接口（SSE）必须关闭缓冲
            proxy_buffering    off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ---------- 上传文件（书籍/教材 PDF、封面）----------
        location /uploads/ {
            proxy_pass         http://wenxing_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 120s;
        }

        # ---------- 健康检查（仅本机）----------
        location = /health {
            allow 127.0.0.1;
            deny  all;
            proxy_pass http://wenxing_api/api/health;
            access_log off;
        }

        # ---------- 根路径跳管理后台 ----------
        location = / {
            return 302 /admin/;
        }
        location = /admin {
            return 301 /admin/;
        }

        # ---------- 管理后台（静态资源）----------
        # 文件位置：/var/www/wenxing/admin/index.html
        location /admin/ {
            root      /var/www/wenxing;
            index     index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        # 带 hash 的静态资源长缓存（仅限 /admin/，避免误伤 /uploads）
        location ~* ^/admin/.*\.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
            root      /var/www/wenxing;
            expires   7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            try_files $uri =404;
        }

        location = /admin/index.html {
            root /var/www/wenxing;
            add_header Cache-Control "no-store" always;
        }
    }
}
